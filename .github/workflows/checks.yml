name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-video-pilot.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch and verify model checkpoint
        run: |
          mkdir -p data/local
          curl -fsSL --retry 3 https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt -o data/local/yolo11n.pt
          echo '0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1  data/local/yolo11n.pt' | sha256sum -c -
      - name: Test model behind the browser upload endpoint
        env:
          QUEUE_REAL_INFERENCE: '1'
          QUEUE_VIDEO_PYTHON: python
          QUEUE_VIDEO_WEIGHTS: data/local/yolo11n.pt
        run: npm test -- --workers=1 inference.spec.js
