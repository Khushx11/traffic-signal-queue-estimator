<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic Signal Queue Estimator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Traffic Signal Queue Estimator</h1><p id="source">Illustrative fixture · simulated counts</p></header>
<main>
<section aria-labelledby="recording">
<h2 id="recording">Recording</h2>
<div class="stage"><video id="video" controls playsinline aria-label="Intersection recording"></video><canvas id="overlay" aria-hidden="true"></canvas><div id="placeholder">Choose a local recording</div></div>
<div class="inputs">
<label>Local recording <input id="recording-file" type="file" accept="video/*"></label>
<label>Prediction JSON <input id="predictions" type="file" accept=".json,application/json"></label>
</div>
<div class="inputs">
<label>Camera configuration <input id="camera-config" type="file" accept=".json,application/json"></label>
<button id="analyze" type="button">Run local inference</button>
</div>
<p id="status" role="status"></p>
</section>
<section aria-labelledby="analysis">
<h2 id="analysis">Queue by lane</h2>
<div class="inputs"><label>Lane <select id="lane"></select></label>
<label><input id="reference" type="checkbox" checked> Reference counts</label></div>
<canvas id="chart" width="640" height="260" aria-label="Queue counts over time"></canvas>
<label class="scrub">Playback position <input id="seek" type="range" min="0" value="0" step="0.1"></label>
<p class="readout" id="readout"></p>
<div class="inputs"><button id="csv">Export CSV</button><button id="json">Export JSON</button></div>
</section>
</main>
<script src="app.js" defer></script>
</body>
</html>
